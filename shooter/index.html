<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sea Legends 3D</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#78d9ff;font-family:Arial;color:white;touch-action:none}#hud{position:fixed;z-index:5;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:4px}.box{background:#101827dd;border-radius:12px;padding:7px 9px;font-size:12px}.bar{width:105px;height:7px;background:#333;border-radius:8px;overflow:hidden}.fill{height:100%;background:#22c55e;width:100%}.banner{position:fixed;z-index:8;top:65px;left:50%;transform:translateX(-50%);background:#101827ee;padding:10px 15px;border-radius:12px;opacity:0}.cross{position:fixed;z-index:4;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:'';position:absolute;background:#fff}.cross:before{width:18px;height:2px;top:8px}.cross:after{height:18px;width:2px;left:8px}.hint{position:fixed;z-index:5;bottom:135px;left:50%;transform:translateX(-50%);background:#101827dd;padding:7px 11px;border-radius:10px;font-size:11px;white-space:nowrap}.stick{position:fixed;z-index:10;left:15px;bottom:14px;width:115px;height:115px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff44}.knob{position:absolute;width:50px;height:50px;left:32px;top:32px;border-radius:50%;background:#ffffff55}.actions{position:fixed;z-index:10;right:12px;bottom:14px;display:flex;gap:7px;flex-wrap:wrap;width:230px;justify-content:flex-end}.actions button{width:63px;height:63px;border:0;border-radius:50%;color:#fff;font-weight:bold;font-size:11px}.attack{background:#e11d48}.fruit{background:#7c3aed}.dash{background:#0891b2}.jump{background:#2563eb}.quest{background:#d97706}.menu{position:fixed;z-index:20;inset:0;background:#071426ee;display:flex;align-items:center;justify-content:center;text-align:center}.card{background:#16253b;border:2px solid #ffffff33;border-radius:20px;padding:28px;width:min(390px,82vw);box-shadow:0 12px 40px #0008}.card h1{margin:0 0 8px;font-size:34px}.card p{opacity:.85}.start{background:#16a34a;color:white;border:0;border-radius:14px;padding:16px 40px;font-size:20px;font-weight:bold}.features{text-align:left;line-height:1.8;margin:18px 0}@media(min-width:800px){.hint:after{content:' • WASD + drag to look'}} </style></head><body><div id="start" class="menu"><div class="card"><h1>🏴‍☠️ SEA LEGENDS</h1><p>A 3D anime pirate adventure</p><div class="features">🏝️ Explore the island<br>⚔️ Fight bandits<br>✨ Find the Mystic Fruit<br>📜 Complete quests<br>⭐ Level up & earn coins</div><button class="start" id="startBtn">PLAY NOW</button></div></div><div id="hud"><div class="box">❤️ <b id="hp">100</b><div class="bar"><div id="hpbar" class="fill"></div></div></div><div class="box">⭐ Lv <b id="level">1</b> • XP <b id="xp">0</b></div><div class="box">💰 <b id="coins">100</b></div><div class="box">🎯 <b id="kills">0</b></div></div><div class="cross"></div><div class="hint">Explore • defeat bandits • find the Mystic Fruit</div><div class="banner" id="banner"></div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="quest" id="quest">QUEST</button><button class="dash" id="dash">DASH</button><button class="jump" id="jump">JUMP</button><button class="fruit" id="fruit">FRUIT</button><button class="attack" id="attack">ATTACK</button></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0x79d8ff);scene.fog=new THREE.Fog(0x79d8ff,28,100);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbdefff,0x335c3b,2.3));let sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(20,40,10);scene.add(sun);const water=new THREE.Mesh(new THREE.PlaneGeometry(140,140),new THREE.MeshStandardMaterial({color:0x168dcc}));water.rotation.x=-Math.PI/2;water.position.y=-.25;scene.add(water);function box(x,y,z,sx,sy,sz,c){let m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color:c,roughness:.8}));m.position.set(x,y,z);scene.add(m);return m}box(0,0,0,42,.8,34,0x54a83b);for(let i=0;i<18;i++){let x=(Math.random()-.5)*38,z=(Math.random()-.5)*30;box(x,1,z,.6,2,.6,0x71452a);let c=new THREE.Mesh(new THREE.SphereGeometry(1.8,10,8),new THREE.MeshStandardMaterial({color:0x16803a}));c.position.set(x,2.5,z);scene.add(c)}for(let i=0;i<5;i++){let x=-12+(i%3)*6,z=-5+Math.floor(i/3)*6;box(x,2,z,4,4,4,0xd28b45);let r=new THREE.Mesh(new THREE.ConeGeometry(3.4,2,4),new THREE.MeshStandardMaterial({color:0x9f1239}));r.position.set(x,5,z);r.rotation.y=Math.PI/4;scene.add(r)}box(0,.15,-18,12,.35,8,0x8b5a2b);box(0,1.4,-22,7,2,2,0x6b4428);box(0,4,-22,.35,7,.35,0x4b3621);const player={pos:new THREE.Vector3(0,1.5,10),yaw:0,pitch:0,hp:100,maxhp:100,level:1,xp:0,coins:100,kills:0,quest:false,questKills:0,fruit:false,fruitCooldown:0,attackCooldown:0,dash:0};const npc=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.1,6,10),new THREE.MeshStandardMaterial({color:0xffc857}));npc.position.set(-3,1,-5);scene.add(npc);const enemies=[];function spawnEnemy(){let a=Math.random()*Math.PI*2,r=9+Math.random()*12,e=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.9,5,8),new THREE.MeshStandardMaterial({color:0x8b1e3f}));e.position.set(Math.cos(a)*r,1,Math.sin(a)*r);e.hp=3;e.cool=1;e.speed=.8+Math.random()*.5;scene.add(e);enemies.push(e)}for(let i=0;i<8;i++)spawnEnemy();let fruitObj=new THREE.Mesh(new THREE.SphereGeometry(.65,16,12),new THREE.MeshStandardMaterial({color:0x8b5cf6,emissive:0x3b0764}));fruitObj.position.set(13,1,8);scene.add(fruitObj);const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function banner(t){let b=document.getElementById('banner');b.textContent=t;b.style.opacity=1;clearTimeout(b.t);b.t=setTimeout(()=>b.style.opacity=0,1700)}function updateHUD(){hp.textContent=Math.max(0,Math.round(player.hp));hpbar.style.width=Math.max(0,player.hp/player.maxhp*100)+'%';level.textContent=player.level;xp.textContent=player.xp;coins.textContent=player.coins;kills.textContent=player.kills}function gainXP(n){player.xp+=n;while(player.xp>=player.level*100){player.xp-=player.level*100;player.level++;player.maxhp+=20;player.hp=player.maxhp;banner('⭐ LEVEL UP! Level '+player.level)}updateHUD()}function nearest(){let b=null,d=999;for(let e of enemies){let q=e.position.distanceTo(player.pos);if(q<d){d=q;b=e}}return b}function attack(){if(player.attackCooldown>0)return;player.attackCooldown=.35;let e=nearest();if(e&&e.position.distanceTo(player.pos)<5){e.hp--;banner('⚔️ HIT!');if(e.hp<=0){scene.remove(e);enemies.splice(enemies.indexOf(e),1);player.kills++;player.coins+=20;gainXP(35);if(player.quest)player.questKills++;setTimeout(spawnEnemy,500)}}updateHUD()}function useFruit(){if(!player.fruit){banner('🍈 Find the Mystic Fruit first!');return}if(player.fruitCooldown>0)return;player.fruitCooldown=3;let hit=0;for(let e of [...enemies])if(e.position.distanceTo(player.pos)<8){e.hp-=3;hit++;if(e.hp<=0){scene.remove(e);enemies.splice(enemies.indexOf(e),1);player.kills++;player.coins+=20;gainXP(45);if(player.quest)player.questKills++;setTimeout(spawnEnemy,500)}}banner('💥 MYSTIC BLAST! '+hit+' hit');updateHUD()}function quest(){if(!player.quest){player.quest=true;player.questKills=0;banner('📜 Quest: Defeat 5 Bandits!')}else if(player.questKills>=5){player.quest=false;player.coins+=300;gainXP(120);banner('🏆 Quest complete! +300 coins')}else banner('📜 Progress: '+player.questKills+'/5')}function dash(){if(player.dash>0)return;player.dash=.8;let v=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),player.yaw);player.pos.addScaledVector(v,5);banner('💨 DASH!')}function jump(){player.pos.y=3;setTimeout(()=>player.pos.y=1.5,320)}let sx=0,sy=0;const stick=document.getElementById('stick'),knob=document.getElementById('knob');stick.onpointermove=stick.onpointerdown=e=>{let r=stick.getBoundingClientRect(),x=e.clientX-r.left-57,y=e.clientY-r.top-57,d=Math.hypot(x,y);if(d>44){x=x/d*44;y=y/d*44}sx=x/44;sy=y/44;knob.style.transform=`translate(${x}px,${y}px)`};stick.onpointerup=stick.onpointercancel=()=>{sx=sy=0;knob.style.transform=''};let lx=0,ly=0;renderer.domElement.onpointerdown=e=>{lx=e.clientX;ly=e.clientY};renderer.domElement.onpointermove=e=>{if(e.buttons){player.yaw-=(e.clientX-lx)*.006;player.pitch-=(e.clientY-ly)*.004;player.pitch=Math.max(-1.15,Math.min(1.15,player.pitch));lx=e.clientX;ly=e.clientY}};attack.onclick=attack;fruit.onclick=useFruit;quest.onclick=quest;dash.onclick=dash;jump.onclick=jump;function checkFruit(){if(!player.fruit&&player.pos.distanceTo(fruitObj.position)<2){player.fruit=true;scene.remove(fruitObj);banner('✨ Mystic Fruit obtained! Press FRUIT')}}function update(dt){let f=(keys.w?1:0)-(keys.s?1:0)-sy,r=(keys.d?1:0)-(keys.a?1:0)+sx,dir=new THREE.Vector3(r,0,-f);if(dir.lengthSq())dir.normalize();dir.applyAxisAngle(new THREE.Vector3(0,1,0),player.yaw);player.pos.addScaledVector(dir,dt*7);player.pos.x=Math.max(-19,Math.min(19,player.pos.x));player.pos.z=Math.max(-15,Math.min(15,player.pos.z));player.attackCooldown=Math.max(0,player.attackCooldown-dt);player.fruitCooldown=Math.max(0,player.fruitCooldown-dt);player.dash=Math.max(0,player.dash-dt);camera.position.copy(player.pos);camera.rotation.set(player.pitch,player.yaw,0,'YXZ');checkFruit();for(let e of enemies){let v=player.pos.clone().sub(e.position);v.y=0;let d=v.length();if(d>2)e.position.addScaledVector(v.normalize(),dt*e.speed);else{e.cool-=dt;if(e.cool<=0){player.hp-=7;e.cool=1;if(player.hp<=0){player.hp=player.maxhp;player.pos.set(0,1.5,10);player.coins=Math.max(0,player.coins-50);banner('💀 Defeated! -50 coins')}updateHUD()}}}}let prev=performance.now();function loop(t){let dt=Math.min(.05,(t-prev)/1000);prev=t;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}startBtn.onclick=()=>{start.style.display='none';banner('🏴‍☠️ Welcome to Sea Legends!');updateHUD()};updateHUD();loop(prev);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
