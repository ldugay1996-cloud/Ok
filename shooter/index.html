<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Sea Legends 3D</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#70d5ff;font-family:Arial;color:#fff;touch-action:none}canvas{display:block;touch-action:none}#hud{position:fixed;z-index:5;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;gap:5px;pointer-events:none}.box{background:#101827dd;border-radius:12px;padding:7px 9px;font-size:12px}.bar{width:95px;height:7px;background:#333;border-radius:8px;overflow:hidden}.fill{height:100%;background:#22c55e;width:100%}.banner{position:fixed;z-index:20;top:62px;left:50%;transform:translateX(-50%);background:#101827ee;padding:10px 15px;border-radius:12px;opacity:0;pointer-events:none}.stick{position:fixed;z-index:30;left:15px;bottom:15px;width:118px;height:118px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;touch-action:none}.knob{position:absolute;width:52px;height:52px;left:31px;top:31px;border-radius:50%;background:#ffffff66}.actions{position:fixed;z-index:30;right:10px;bottom:12px;display:grid;grid-template-columns:repeat(3,64px);gap:7px}.actions button{width:64px;height:64px;border:0;border-radius:50%;color:#fff;font-weight:bold;font-size:10px;touch-action:none;-webkit-user-select:none;user-select:none}.power{background:#7c3aed}.fruit{background:#db2777}.dash{background:#0891b2}.jump{background:#2563eb}.quest{background:#d97706}.menu{position:fixed;z-index:50;inset:0;background:#071426ee;display:flex;align-items:center;justify-content:center;text-align:center}.card{background:#16253b;border:2px solid #ffffff33;border-radius:20px;padding:26px;width:min(390px,86vw);box-shadow:0 12px 40px #0008}.card h1{font-size:34px;margin:0 0 8px}.card p{opacity:.85}.start{background:#16a34a;color:white;border:0;border-radius:14px;padding:16px 40px;font-size:20px;font-weight:bold}.features{text-align:left;line-height:1.8;margin:16px 0}.hint{position:fixed;z-index:5;bottom:138px;left:50%;transform:translateX(-50%);background:#101827cc;padding:7px 11px;border-radius:10px;font-size:11px;white-space:nowrap;pointer-events:none}</style></head><body><div id="start" class="menu"><div class="card"><h1>🏴‍☠️ SEA LEGENDS</h1><p>3D island adventure</p><div class="features">🏝️ Explore the island<br>✨ Find the Mystic Fruit<br>⚡ Use fantasy powers<br>📜 Complete quests<br>⭐ Level up and earn coins</div><button class="start" id="startBtn">PLAY NOW</button></div></div><div id="hud"><div class="box">❤️ <b id="hp">100</b><div class="bar"><div id="hpbar" class="fill"></div></div></div><div class="box">⭐ Lv <b id="level">1</b> • XP <b id="xp">0</b></div><div class="box">💰 <b id="coins">100</b></div><div class="box">✨ <b id="kills">0</b></div></div><div class="banner" id="banner"></div><div class="hint">Move with the joystick • drag the screen to look</div><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="quest" id="quest">QUEST</button><button class="dash" id="dash">DASH</button><button class="jump" id="jump">JUMP</button><button class="fruit" id="fruit">FRUIT</button><button class="power" id="power">POWER</button></div><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>const scene=new THREE.Scene();scene.background=new THREE.Color(0x79d8ff);scene.fog=new THREE.Fog(0x79d8ff,30,105);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,150);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xbdefff,0x315b39,2.4));const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(20,40,10);scene.add(sun);const water=new THREE.Mesh(new THREE.PlaneGeometry(150,150),new THREE.MeshStandardMaterial({color:0x158dcc}));water.rotation.x=-Math.PI/2;water.position.y=-.35;scene.add(water);const obstacles=[];function block(x,y,z,sx,sy,sz,c,solid=true){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),new THREE.MeshStandardMaterial({color:c,roughness:.8}));m.position.set(x,y,z);scene.add(m);if(solid)obstacles.push({x,z,sx,sz});return m}block(0,0,0,42,.7,34,0x4f9f38);block(0,2,-16,42,4,1,0x2d6a36);block(-20,2,0,1,4,34,0x2d6a36);block(20,2,0,1,4,34,0x2d6a36);block(0,2,16,42,4,1,0x2d6a36);for(let i=0;i<14;i++){const x=(Math.random()-.5)*34,z=(Math.random()-.5)*25;block(x,1,z,.7,2,.7,0x71452a);const t=new THREE.Mesh(new THREE.SphereGeometry(1.7,10,8),new THREE.MeshStandardMaterial({color:0x16803a}));t.position.set(x,2.5,z);scene.add(t)}for(let i=0;i<5;i++){const x=-12+(i%3)*6,z=-4+Math.floor(i/3)*6;block(x,2,z,3.5,4,3.5,0xd28b45);const r=new THREE.Mesh(new THREE.ConeGeometry(3,2,4),new THREE.MeshStandardMaterial({color:0x9f1239}));r.position.set(x,5,z);r.rotation.y=Math.PI/4;scene.add(r)}block(0,.2,-11,11,.4,5,0x8b5a2b);block(0,1.5,-13,7,2,1.5,0x65421f);block(0,4,-13,.3,7,.3,0x4b3621);const player={pos:new THREE.Vector3(0,1.6,10),yaw:0,pitch:0,hp:100,maxhp:100,level:1,xp:0,coins:100,kills:0,quest:false,questKills:0,fruit:false,powerCooldown:0,fruitCooldown:0,dashCooldown:0,vy:0,onGround:true};const fruitObj=new THREE.Mesh(new THREE.SphereGeometry(.7,16,12),new THREE.MeshStandardMaterial({color:0x8b5cf6,emissive:0x3b0764}));fruitObj.position.set(13,1,8);scene.add(fruitObj);const enemies=[];function spawnEnemy(){let a=Math.random()*Math.PI*2,r=9+Math.random()*10,e=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.9,5,8),new THREE.MeshStandardMaterial({color:0x8b1e3f}));e.position.set(Math.cos(a)*r,1,Math.sin(a)*r);e.hp=3;e.cool=1;e.speed=.7+Math.random()*.35;scene.add(e);enemies.push(e)}for(let i=0;i<7;i++)spawnEnemy();const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function msg(t){const b=document.getElementById('banner');b.textContent=t;b.style.opacity=1;clearTimeout(b.t);b.t=setTimeout(()=>b.style.opacity=0,1500)}function hud(){hp.textContent=Math.max(0,Math.round(player.hp));hpbar.style.width=Math.max(0,player.hp/player.maxhp*100)+'%';level.textContent=player.level;xp.textContent=player.xp;coins.textContent=player.coins;kills.textContent=player.kills}function xpGain(n){player.xp+=n;while(player.xp>=player.level*100){player.xp-=player.level*100;player.level++;player.maxhp+=20;player.hp=player.maxhp;msg('⭐ LEVEL UP! '+player.level)}hud()}function collides(x,z){const r=.65;for(const o of obstacles){if(x+r>o.x-o.sx/2&&x-r<o.x+o.sx/2&&z+r>o.z-o.sz/2&&z-r<o.z+o.sz/2)return true}return false}function moveWithCollision(dx,dz){let nx=player.pos.x+dx,nz=player.pos.z+dz;if(!collides(nx,player.pos.z))player.pos.x=nx;if(!collides(player.pos.x,nz))player.pos.z=nz}function nearest(){let best=null,d=5;for(const e of enemies){const q=e.position.distanceTo(player.pos);if(q<d){d=q;best=e}}return best}function power(){if(player.powerCooldown>0)return;player.powerCooldown=.45;const e=nearest();if(e){e.hp--;msg('✨ POWER HIT!');if(e.hp<=0){scene.remove(e);enemies.splice(enemies.indexOf(e),1);player.kills++;player.coins+=20;xpGain(35);if(player.quest)player.questKills++;setTimeout(spawnEnemy,500)}}hud()}function fruitPower(){if(!player.fruit){msg('🍈 Find the Mystic Fruit first!');return}if(player.fruitCooldown>0)return;player.fruitCooldown=3;let n=0;for(const e of [...enemies])if(e.position.distanceTo(player.pos)<8){e.hp-=3;n++;if(e.hp<=0){scene.remove(e);enemies.splice(enemies.indexOf(e),1);player.kills++;player.coins+=20;xpGain(45);if(player.quest)player.questKills++;setTimeout(spawnEnemy,500)}}msg('💥 MYSTIC BLAST! '+n+' hit');hud()}function questFn(){if(!player.quest){player.quest=true;player.questKills=0;msg('📜 Quest: defeat 5 bandits')}else if(player.questKills>=5){player.quest=false;player.coins+=300;xpGain(120);msg('🏆 Quest complete! +300 coins')}else msg('📜 Progress '+player.questKills+'/5')}function dash(){if(player.dashCooldown>0)return;player.dashCooldown=1;const v=new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),player.yaw);moveWithCollision(v.x*4,v.z*4);msg('💨 DASH!')}function jump(){if(!player.onGround)return;player.vy=7;player.onGround=false}let sx=0,sy=0;const stick=document.getElementById('stick'),knob=document.getElementById('knob');function joy(e){e.preventDefault();const r=stick.getBoundingClientRect();let x=e.clientX-r.left-59,y=e.clientY-r.top-59,d=Math.hypot(x,y);if(d>45){x=x/d*45;y=y/d*45}sx=x/45;sy=y/45;knob.style.transform='translate('+x+'px,'+y+'px)'}stick.addEventListener('pointerdown',e=>{stick.setPointerCapture(e.pointerId);joy(e)});stick.addEventListener('pointermove',e=>{if(stick.hasPointerCapture(e.pointerId))joy(e)});stick.addEventListener('pointerup',()=>{sx=sy=0;knob.style.transform=''});stick.addEventListener('pointercancel',()=>{sx=sy=0;knob.style.transform=''});let lookId=null,lx=0,ly=0;renderer.domElement.addEventListener('pointerdown',e=>{lookId=e.pointerId;lx=e.clientX;ly=e.clientY});renderer.domElement.addEventListener('pointermove',e=>{if(e.pointerId!==lookId)return;player.yaw-=(e.clientX-lx)*.006;player.pitch-=(e.clientY-ly)*.004;player.pitch=Math.max(-1.1,Math.min(1.1,player.pitch));lx=e.clientX;ly=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookId)lookId=null});renderer.domElement.addEventListener('pointercancel',()=>lookId=null);function tap(id,fn){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn()})}tap('power',power);tap('fruit',fruitPower);tap('quest',questFn);tap('dash',dash);tap('jump',jump);function update(dt){let f=(keys.w?1:0)-(keys.s?1:0)-sy,r=(keys.d?1:0)-(keys.a?1:0)+sx;const dir=new THREE.Vector3(r,0,-f);if(dir.lengthSq())dir.normalize();dir.applyAxisAngle(new THREE.Vector3(0,1,0),player.yaw);moveWithCollision(dir.x*dt*6,dir.z*dt*6);player.vy-=18*dt;player.pos.y+=player.vy*dt;if(player.pos.y<=1.6){player.pos.y=1.6;player.vy=0;player.onGround=true}player.powerCooldown=Math.max(0,player.powerCooldown-dt);player.fruitCooldown=Math.max(0,player.fruitCooldown-dt);player.dashCooldown=Math.max(0,player.dashCooldown-dt);if(!player.fruit&&player.pos.distanceTo(fruitObj.position)<2){player.fruit=true;scene.remove(fruitObj);msg('✨ Mystic Fruit obtained!')}for(const e of enemies){const v=player.pos.clone().sub(e.position);v.y=0;const d=v.length();if(d>2)e.position.addScaledVector(v.normalize(),dt*e.speed);else{e.cool-=dt;if(e.cool<=0){player.hp-=7;e.cool=1;if(player.hp<=0){player.hp=player.maxhp;player.pos.set(0,1.6,10);player.coins=Math.max(0,player.coins-50);msg('💫 You were knocked out! -50 coins')}hud()}}}camera.position.copy(player.pos);camera.rotation.set(player.pitch,player.yaw,0,'YXZ');fruitObj.rotation.y+=dt*2}let last=performance.now();function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}startBtn.addEventListener('pointerdown',e=>{e.preventDefault();start.style.display='none';msg('🏴‍☠️ Welcome to Sea Legends!')});hud();loop(last);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
