<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Neon Arena 3D</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#050712;font-family:Arial;color:#fff;touch-action:none}#hud{position:fixed;z-index:5;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.box{background:#111827cc;border:1px solid #ffffff33;border-radius:12px;padding:8px 12px}.cross{position:fixed;z-index:4;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}.cross:before,.cross:after{content:'';position:absolute;background:#fff}.cross:before{width:22px;height:2px;top:10px}.cross:after{height:22px;width:2px;left:10px}#mobile{position:fixed;z-index:6;inset:auto 0 15px 0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.stick,.actions{pointer-events:auto}.stick{width:120px;height:120px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff33;position:relative}.knob{position:absolute;width:52px;height:52px;left:34px;top:34px;border-radius:50%;background:#ffffff44}.actions{display:flex;gap:12px;align-items:end}.fire{width:82px;height:82px;border-radius:50%;border:0;background:#ef4444;color:#fff;font-weight:bold;font-size:18px}.jump{width:65px;height:65px;border-radius:50%;border:0;background:#2563eb;color:#fff;font-weight:bold}.hint{position:fixed;z-index:5;bottom:150px;left:50%;transform:translateX(-50%);background:#111827cc;padding:7px 12px;border-radius:10px;font-size:12px;opacity:.85}@media(min-width:800px){#mobile{opacity:.65}.hint:after{content:' • WASD + Mouse/Click also work';}}</style></head>
<body><div id="hud"><div class="box">❤️ HP <b id="hp">100</b></div><div class="box">🎯 Score <b id="score">0</b></div><div class="box">👾 Enemies <b id="enemies">0</b></div></div><div class="cross"></div><div class="hint">Move with the joystick • Aim by dragging • FIRE!</div><div id="mobile"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="jump" id="jump">JUMP</button><button class="fire" id="fire">FIRE</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070b18);scene.fog=new THREE.Fog(0x070b18,18,65);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,100);camera.position.set(0,2.2,8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9fd9ff,0x172033,2));const dl=new THREE.DirectionalLight(0xffffff,2);dl.position.set(5,10,4);scene.add(dl);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({color:0x182235,roughness:.9}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const grid=new THREE.GridHelper(80,80,0x31506b,0x172a3a);scene.add(grid);
for(let i=0;i<22;i++){let h=1+Math.random()*4;let b=new THREE.Mesh(new THREE.BoxGeometry(1.5,h,1.5),new THREE.MeshStandardMaterial({color:0x263b55,roughness:.8}));b.position.set((Math.random()-.5)*42,h/2,(Math.random()-.5)*42);scene.add(b)}
const player={pos:new THREE.Vector3(0,1.7,8),yaw:0,pitch:0,hp:100,score:0};
const enemies=[];function spawn(){let a=Math.random()*Math.PI*2,r=14+Math.random()*14,e=new THREE.Mesh(new THREE.SphereGeometry(.65,16,12),new THREE.MeshStandardMaterial({color:0xff315c,emissive:0x550015}));e.position.set(Math.cos(a)*r,.8,Math.sin(a)*r);e.hp=2;e.cool=Math.random()*2;scene.add(e);enemies.push(e)}for(let i=0;i<6;i++)spawn();
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let firing=false,lastShot=0;function shoot(){let now=performance.now();if(now-lastShot<180)return;lastShot=now;const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(0,0),camera);const hits=ray.intersectObjects(enemies);if(hits.length){let e=hits[0].object;e.hp--;if(e.hp<=0){scene.remove(e);enemies.splice(enemies.indexOf(e),1);player.score+=100;document.getElementById('score').textContent=player.score;setTimeout(spawn,350)}}}
const fire=document.getElementById('fire');fire.onpointerdown=()=>firing=true;fire.onpointerup=fire.onpointercancel=()=>firing=false;
let stickX=0,stickY=0;const stick=document.getElementById('stick'),knob=document.getElementById('knob');stick.onpointermove=stick.onpointerdown=e=>{let r=stick.getBoundingClientRect(),x=e.clientX-r.left-60,y=e.clientY-r.top-60;let d=Math.hypot(x,y);if(d>45){x=x/d*45;y=y/d*45}stickX=x/45;stickY=y/45;knob.style.transform=`translate(${x}px,${y}px)`};stick.onpointerup=stick.onpointercancel=()=>{stickX=stickY=0;knob.style.transform=''};
let aimX=0,aimY=0,lastX=0,lastY=0;renderer.domElement.onpointerdown=e=>{if(e.clientX<160&&e.clientY>innerHeight-170)return;lastX=e.clientX;lastY=e.clientY};renderer.domElement.onpointermove=e=>{if(e.buttons){let dx=e.clientX-lastX,dy=e.clientY-lastY;player.yaw-=dx*.006;player.pitch-=dy*.004;player.pitch=Math.max(-1.2,Math.min(1.2,player.pitch));lastX=e.clientX;lastY=e.clientY}};
document.getElementById('jump').onclick=()=>{player.pos.y=3;setTimeout(()=>player.pos.y=1.7,300)};
function update(dt){let f=(keys.w?1:0)-(keys.s?1:0)-stickY,r=(keys.d?1:0)-(keys.a?1:0)+stickX;let dir=new THREE.Vector3(r,0,-f);if(dir.lengthSq()>0)dir.normalize();dir.applyAxisAngle(new THREE.Vector3(0,1,0),player.yaw);player.pos.addScaledVector(dir,dt*7);player.pos.x=Math.max(-36,Math.min(36,player.pos.x));player.pos.z=Math.max(-36,Math.min(36,player.pos.z));camera.position.copy(player.pos);camera.rotation.set(player.pitch,player.yaw,0,'YXZ');if(firing)shoot();for(const e of enemies){let v=player.pos.clone().sub(e.position);v.y=0;let d=v.length();if(d>1.5)e.position.addScaledVector(v.normalize(),dt*1.2);else{e.cool-=dt;if(e.cool<=0){player.hp-=5;e.cool=1;document.getElementById('hp').textContent=Math.max(0,Math.round(player.hp));if(player.hp<=0){player.hp=100;player.pos.set(0,1.7,8);player.score=Math.max(0,player.score-200);document.getElementById('score').textContent=player.score}}}}document.getElementById('enemies').textContent=enemies.length}
let prev=performance.now();function loop(t){let dt=Math.min(.05,(t-prev)/1000);prev=t;update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}loop(prev);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
