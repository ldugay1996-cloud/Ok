<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildWorld</title><style>body{margin:0;font-family:Arial,sans-serif;background:#87ceeb;text-align:center;color:#111}h1{margin:10px}.bar{padding:8px;background:#222;color:white;display:flex;flex-wrap:wrap;justify-content:center;gap:4px}button{font-size:18px;padding:10px;margin:2px;border:0;border-radius:8px}.info{background:white;margin:6px auto;padding:8px;max-width:900px;border-radius:8px}#world{width:92vw;height:65vh;max-width:900px;margin:10px auto;background:#7ec850;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(10,1fr);gap:2px;touch-action:none;user-select:none}.cell{background:#9be564;border:1px solid #6da840;display:flex;align-items:center;justify-content:center;transform-origin:center}.b{background:#8b5a2b;border:1px solid #654321}.g{background:#55a630}.selected{outline:4px solid #ffd700;z-index:2}.rot{transition:transform .15s}</style></head><body><h1>🎮 BuildWorld</h1><div class="info">Select a block, then press ↻ Rotate Block.</div><div class="bar"><button onclick="mode='build'">🧱 Build</button><button onclick="mode='break'">⛏️ Break</button><button onclick="rotateSelected()">↻ Rotate Block</button><button onclick="clearWorld()">🗑️ Clear</button></div><div id="world"></div><script>let mode='build',w=document.getElementById('world'),selected=null;function make(){w.innerHTML='';for(let i=0;i<120;i++){let d=document.createElement('div');d.className=i>=96?'cell g':'cell';d.onclick=e=>{e.stopPropagation();if(mode==='build')d.className='cell b rot';else if(mode==='break')d.className='cell';select(d)};w.appendChild(d)}}function select(d){if(selected)selected.classList.remove('selected');selected=d;if(d.classList.contains('b'))d.classList.add('selected')}function rotateSelected(){if(!selected||!selected.classList.contains('b'))return;let r=Number(selected.dataset.rot||0)+90;selected.dataset.rot=r%360;selected.style.transform='rotate('+r+'deg)'}function clearWorld(){[...w.children].forEach((d,i)=>{d.className=i>=96?'cell g':'cell';d.style.transform='';delete d.dataset.rot});selected=null}make();</script></body></html>
