<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildWorld</title><style>body{margin:0;font-family:Arial;background:#87ceeb;text-align:center}h1{margin:10px}.bar{padding:8px;background:#222;color:white}button{font-size:18px;padding:10px;margin:4px}#world{width:92vw;height:65vh;margin:auto;background:#7ec850;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(10,1fr);gap:1px}.b{background:#8b5a2b;border:1px solid #654321}.g{background:#55a630}.x{background:#5c4033}</style></head><body><h1>🎮 BuildWorld</h1><div class="bar"><button onclick="mode='build'">🧱 Build</button><button onclick="mode='break'">⛏️ Break</button><button onclick="clearWorld()">🗑️ Clear</button></div><div id="world"></div><script>let mode='build',w=document.getElementById('world');function make(){w.innerHTML='';for(let i=0;i<120;i++){let d=document.createElement('div');d.className=i>95?'g':'';d.onclick=()=>{if(mode==='build')d.className='b';else d.className='';};w.appendChild(d)}}function clearWorld(){[...w.children].forEach(d=>d.className='')}make();</script></body></html>
