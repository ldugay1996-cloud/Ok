<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildWorld</title><style>body{margin:0;font-family:Arial,sans-serif;background:#87ceeb;text-align:center;color:#111}h1{margin:10px}.bar{padding:8px;background:#222;color:white;display:flex;flex-wrap:wrap;justify-content:center;gap:4px}button{font-size:18px;padding:10px;margin:2px;border:0;border-radius:8px}#world{width:92vw;height:65vh;max-width:900px;margin:10px auto;background:#7ec850;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(10,1fr);gap:2px;touch-action:none;user-select:none;transition:transform .15s}.cell{background:#9be564;border:1px solid #6da840}.b{background:#8b5a2b;border:1px solid #654321}.g{background:#55a630}.info{background:white;margin:6px auto;padding:8px;max-width:900px;border-radius:8px}#rotate{font-size:20px}</style></head><body><h1>🎮 BuildWorld</h1><div class="info">Build, break, clear, and rotate your world.</div><div class="bar"><button onclick="mode='build'">🧱 Build</button><button onclick="mode='break'">⛏️ Break</button><button onclick="clearWorld()">🗑️ Clear</button><button id="rotate" onclick="rotateWorld()">↻ Rotate</button></div><div id="world"></div><script>let mode='build',w=document.getElementById('world'),angle=0,drag=false,startX=0;function make(){w.innerHTML='';for(let i=0;i<120;i++){let d=document.createElement('div');d.className=i>=96?'cell g':'cell';d.onclick=()=>{if(!drag)d.className=mode==='build'?'cell b':'cell'};w.appendChild(d)}}function rotateWorld(){angle=(angle+90)%360;w.style.transform='rotate('+angle+'deg)'}function clearWorld(){[...w.children].forEach((d,i)=>d.className=i>=96?'cell g':'cell')}w.addEventListener('pointerdown',e=>{startX=e.clientX;drag=false;w.setPointerCapture(e.pointerId)});w.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-startX)>25){drag=true;angle=(angle+(e.clientX>startX?3:-3)+360)%360;w.style.transform='rotate('+angle+'deg)';startX=e.clientX}});w.addEventListener('pointerup',()=>setTimeout(()=>drag=false,50));make();</script></body></html>
