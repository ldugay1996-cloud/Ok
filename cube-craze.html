<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Cube Craze</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f5f7ff;font:16px system-ui;text-align:center}h1{margin:18px 0 4px}.wrap{max-width:850px;margin:auto;padding:12px;display:grid;grid-template-columns:1fr 260px;gap:12px}.panel{background:#1b2940;border:1px solid #394c69;border-radius:16px;padding:12px}canvas{width:100%;max-width:540px;aspect-ratio:1;background:#111b2a;border-radius:12px;touch-action:none}button,select{width:100%;padding:10px;margin:4px 0;border-radius:10px;border:1px solid #536985;background:#2c405d;color:white;font:inherit}.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.moves button{padding:9px 2px}.hint{font-size:13px;color:#aebbd0;line-height:1.5}@media(max-width:650px){.wrap{grid-template-columns:1fr}}</style></head><body><h1>🧊 CUBE CRAZE</h1><p>Choose your cube • Twist • Scramble • Solve</p><main class="wrap"><section class="panel"><canvas id="cv" width="640" height="640"></canvas><p id="status">3 × 3</p><button id="mix">🔀 Scramble</button><button id="reset">↻ Reset solved</button><button id="sound">🔊 Sound: On</button><p class="hint">Drag the cube to look around. Use the buttons to turn faces.</p></section><section class="panel"><b>Cube size</b><select id="size"></select><b>Turn a face</b><div class="moves" id="moves"><button data-m="U">U</button><button data-m="U'">U'</button><button data-m="U2">U2</button><button data-m="R">R</button><button data-m="R'">R'</button><button data-m="R2">R2</button><button data-m="F">F</button><button data-m="F'">F'</button><button data-m="F2">F2</button><button data-m="L">L</button><button data-m="L'">L'</button><button data-m="L2">L2</button><button data-m="D">D</button><button data-m="D'">D'</button><button data-m="D2">D2</button><button data-m="B">B</button><button data-m="B'">B'</button><button data-m="B2">B2</button></div><p class="hint">U top · D bottom · R right · L left · F front · B back.<br>Prime (') means counterclockwise; 2 means a half-turn. All sizes 2×2 through 15×15.</p></section></main>
<script>
(()=>{const cv=document.querySelector('#cv'),ctx=cv.getContext('2d'),sel=document.querySelector('#size'),status=document.querySelector('#status');for(let i=2;i<=15;i++){let o=document.createElement('option');o.value=i;o.textContent=i+' × '+i;if(i===3)o.selected=true;sel.append(o)}
const col={U:'#f7f7f0',D:'#ffdf00',F:'#20bb60',B:'#2877ec',R:'#e53935',L:'#ff8618'},norm={U:[0,1,0],D:[0,-1,0],F:[0,0,1],B:[0,0,-1],R:[1,0,0],L:[-1,0,0]};let n=3,tiles=[],yaw=-.65,pitch=-.4,drag=null,moves=0,sound=true,audio;
function pos(f,r,c){let u=(c+.5)*2/n-1,v=(r+.5)*2/n-1;return {U:[u,1,-v],D:[u,-1,v],F:[u,-v,1],B:[-u,-v,-1],R:[1,-v,-u],L:[-1,-v,u]}[f]}
function rot(v,a,t){let [x,y,z]=v,c=Math.round(Math.cos(t)),s=Math.round(Math.sin(t));return a==='x'?[x,c*y-s*z,s*y+c*z]:a==='y'?[c*x+s*z,y,-s*x+c*z]:[c*x-s*y,s*x+c*y,z]}
function face(v){return v[1]>.5?'U':v[1]<-.5?'D':v[0]>.5?'R':v[0]<-.5?'L':v[2]>.5?'F':'B'}
function rc(f,p){let [x,y,z]=p,r,c;if(f==='U'){r=Math.round((1-z)*n/2-.5);c=Math.round((x+1)*n/2-.5)}else if(f==='D'){r=Math.round((z+1)*n/2-.5);c=Math.round((x+1)*n/2-.5)}else if(f==='F'){r=Math.round((1-y)*n/2-.5);c=Math.round((x+1)*n/2-.5)}else if(f==='B'){r=Math.round((1-y)*n/2-.5);c=Math.round((1-x)*n/2-.5)}else if(f==='R'){r=Math.round((1-y)*n/2-.5);c=Math.round((1-z)*n/2-.5)}else{r=Math.round((1-y)*n/2-.5);c=Math.round((z+1)*n/2-.5)}return [Math.max(0,Math.min(n-1,r)),Math.max(0,Math.min(n-1,c))]}
function init(){tiles=[];for(let f in col)for(let r=0;r<n;r++)for(let c=0;c<n;c++)tiles.push({f,r,c,color:col[f]});moves=0;draw();stat()}
function stat(){status.textContent=n+' × '+n+' • '+moves+' moves'}
function beep(){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=650;g.gain.value=.03;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.05)}catch(e){}}
function turn(m){let f=m[0],a={U:'y',D:'y',R:'x',L:'x',F:'z',B:'z'}[f],layer={U:1,D:-1,R:1,L:-1,F:1,B:-1}[f],sign=(f==='D'||f==='L'||f==='B'?-1:1)*(m.includes("'")?-1:1),ang=sign*(m.includes('2')?Math.PI:Math.PI/2);tiles=tiles.map(t=>{let p=pos(t.f,t.r,t.c),v=p[a==='x'?0:a==='y'?1:2];if(Math.abs(v-layer)>1/n+.001)return t;let np=rot(p,a,ang),nf=face(rot(norm[t.f],a,ang)),[r,c]=rc(nf,np);return {...t,f:nf,r,c}});moves++;beep();draw();stat()}
function proj(v){let p=rot(rot(v,'y',yaw),'x',pitch),s=270,k=4/(4-p[2]*.3);return [320+p[0]*s*k,320-p[1]*s*k,p[2]]}
function draw(){ctx.clearRect(0,0,640,640);let bg=ctx.createRadialGradient(320,260,20,320,320,420);bg.addColorStop(0,'#2a405e');bg.addColorStop(1,'#101827');ctx.fillStyle=bg;ctx.fillRect(0,0,640,640);let list=[];for(let t of tiles){let p=pos(t.f,t.r,t.c),u,v;({U:[u,v]=[[1,0,0],[0,0,-1]],D:[u,v]=[[1,0,0],[0,0,1]],F:[u,v]=[[1,0,0],[0,-1,0]],B:[u,v]=[[-1,0,0],[0,-1,0]],R:[u,v]=[[0,0,-1],[0,-1,0]],L:[u,v]=[[0,0,1],[0,-1,0]]})[t.f];let h=.47/n,cs=[[-h,-h],[h,-h],[h,h],[-h,h]].map(([a,b])=>[p[0]+u[0]*a+v[0]*b,p[1]+u[1]*a+v[1]*b,p[2]+u[2]*a+v[2]*b]);if(rot(rot(norm[t.f],'y',yaw),'x',pitch)[2]<.02)list.push({cs,color:t.color,z:proj(p)[2]})}list.sort((a,b)=>a.z-b.z);for(let f of list){let q=f.cs.map(proj);ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);q.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=f.color;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#080d15';ctx.stroke()}}
document.querySelector('#moves').onclick=e=>{let b=e.target.closest('[data-m]');if(b)turn(b.dataset.m)};document.querySelector('#reset').onclick=init;sel.onchange=()=>{n=+sel.value;init()};document.querySelector('#sound').onclick=e=>{sound=!sound;e.target.textContent=sound?'🔊 Sound: On':'🔇 Sound: Off'};document.querySelector('#mix').onclick=()=>{let fs='URFDLB',last='',k=Math.min(70,n*7+12);for(let i=0;i<k;i++){let f;do{f=fs[Math.random()*6|0]}while(f===last);last=f;turn(f+(['',"'",'2'][Math.random()*3|0]))}status.textContent='Scrambled '+n+' × '+n+' cube!'};cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};cv.setPointerCapture(e.pointerId)};cv.onpointermove=e=>{if(!drag)return;yaw=drag.yaw+(e.clientX-drag.x)*.009;pitch=Math.max(-1.4,Math.min(1.4,drag.pitch+(e.clientY-drag.y)*.009));draw()};cv.onpointerup=cv.onpointercancel=()=>drag=null;init()})();
</script></body></html>
